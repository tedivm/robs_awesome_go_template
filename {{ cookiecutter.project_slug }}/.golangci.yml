version: "2"

run:
  timeout: 5m

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
      colors: true

linters:
  default: none
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
  disable:
    - gochecknoglobals

formatters:
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - {{ cookiecutter.import_path }}
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
