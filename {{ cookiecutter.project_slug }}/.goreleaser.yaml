version: 2

before:
  hooks:
    - go mod tidy

env:
  - IMPORT_PATH={{ cookiecutter.import_path }}

builds:
{% if cookiecutter.include_web == "y" %}
  - id: {{ cookiecutter.project_slug }}
    main: ./cmd/{{ cookiecutter.project_slug }}
    binary: {{ cookiecutter.project_slug }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
{% raw %}
      - -s -w -X {{ .Env.IMPORT_PATH }}/internal/version.Version={{ .Tag }} -X {{ .Env.IMPORT_PATH }}/internal/version.Commit={{ .Commit }} -X {{ .Env.IMPORT_PATH }}/internal/version.Date={{ .Date }}
{% endraw %}
{% endif %}
{% if cookiecutter.include_cli == "y" and cookiecutter.include_orm == "y" %}

  - id: cli
    main: ./cmd/cli
    binary: cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
{% raw %}
      - -s -w -X {{ .Env.IMPORT_PATH }}/internal/version.Version={{ .Tag }} -X {{ .Env.IMPORT_PATH }}/internal/version.Commit={{ .Commit }} -X {{ .Env.IMPORT_PATH }}/internal/version.Date={{ .Date }}
{% endraw %}
{% endif %}

archives:
  - format: tar.gz
    name_template: >-
{% raw %}
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
{% endraw %}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: SHA256SUMS

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
