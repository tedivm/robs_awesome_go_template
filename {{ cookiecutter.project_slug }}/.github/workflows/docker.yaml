name: Docker
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
{% raw %}
        if: github.event_name != 'pull_request'
{% endraw %}
        with:
          registry: ghcr.io
{% raw %}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
{% endraw %}
      - name: Compute tags
        id: tags
        shell: bash
        run: |
          ref="{% raw %}${{ github.ref_name }}{% endraw %}"
          if [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ver="${ref#v}"
            major="${ver%%.*}"
            minor_full="${ver#*.}"
            minor="${minor_full%%.*}"
            echo "t1=web-${ref}" >> $GITHUB_OUTPUT
            echo "t2=web-v${major}" >> $GITHUB_OUTPUT
            echo "t3=web-v${major}.${minor}" >> $GITHUB_OUTPUT
          else
            echo "t1=web-${ref}" >> $GITHUB_OUTPUT
            echo "t2=web-${ref}" >> $GITHUB_OUTPUT
            echo "t3=web-${ref}" >> $GITHUB_OUTPUT
          fi
{% if cookiecutter.include_cli == "y" and cookiecutter.include_orm == "y" %}
          ref="{% raw %}${{ github.ref_name }}{% endraw %}"
          if [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ver="${ref#v}"
            major="${ver%%.*}"
            minor_full="${ver#*.}"
            minor="${minor_full%%.*}"
            echo "c1=cli-${ref}" >> $GITHUB_OUTPUT
            echo "c2=cli-v${major}" >> $GITHUB_OUTPUT
            echo "c3=cli-v${major}.${minor}" >> $GITHUB_OUTPUT
          else
            echo "c1=cli-${ref}" >> $GITHUB_OUTPUT
            echo "c2=cli-${ref}" >> $GITHUB_OUTPUT
            echo "c3=cli-${ref}" >> $GITHUB_OUTPUT
          fi
{% endif %}{% if cookiecutter.include_workers == "y" %}
          ref="{% raw %}${{ github.ref_name }}{% endraw %}"
          if [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ver="${ref#v}"
            major="${ver%%.*}"
            minor_full="${ver#*.}"
            minor="${minor_full%%.*}"
            echo "w1=worker-${ref}" >> $GITHUB_OUTPUT
            echo "w2=worker-v${major}" >> $GITHUB_OUTPUT
            echo "w3=worker-v${major}.${minor}" >> $GITHUB_OUTPUT
          else
            echo "w1=worker-${ref}" >> $GITHUB_OUTPUT
            echo "w2=worker-${ref}" >> $GITHUB_OUTPUT
            echo "w3=worker-${ref}" >> $GITHUB_OUTPUT
          fi
{% endif %}
{% if cookiecutter.include_web == "y" %}
      - name: Build and push web
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web-build
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
{% raw %}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.t1 }}
            ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.t2 }}
            ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.t3 }}
{% endraw %}{% endif %}{% if cookiecutter.include_cli == "y" and cookiecutter.include_orm == "y" %}
      - name: Build and push CLI
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: cli-build
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=cli
          cache-to: type=gha,scope=cli,mode=max
{% raw %}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.c1 }}
            ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.c2 }}
            ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.c3 }}
{% endraw %}{% endif %}{% if cookiecutter.include_workers == "y" %}
      - name: Build and push worker
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker-build
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
{% raw %}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.w1 }}
            ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.w2 }}
            ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.w3 }}
{% endraw %}{% endif %}