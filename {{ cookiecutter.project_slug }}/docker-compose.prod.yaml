services:
{% if cookiecutter.include_web == "y" %}
  web:
    build:
      context: .
      target: web-build
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_SERVER_ENVIRONMENT=production
      - APP_LOG_LEVEL=info
{% if cookiecutter.include_orm == "y" %}
      - APP_DATABASE_DRIVER=postgres
      - APP_DATABASE_DSN=host=db user=postgres password=${DB_PASSWORD:-postgres} dbname=app port=5432 sslmode=disable
{% endif %}{% if cookiecutter.include_workers == "y" %}
      - APP_REDIS_ADDR=redis:6379
{% endif %}
    {% if cookiecutter.include_orm == "y" and cookiecutter.include_workers == "y" %}depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    {% elif cookiecutter.include_orm == "y" %}
    depends_on:
      db:
        condition: service_healthy
    {% elif cookiecutter.include_workers == "y" %}
    depends_on:
      redis:
        condition: service_started
    {% endif %}deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M

{% endif %}{% if cookiecutter.include_workers == "y" %}
  worker:
    build:
      context: .
      target: worker-build
    restart: unless-stopped
    environment:
      - APP_LOG_LEVEL=info
      - APP_REDIS_ADDR=redis:6379
{% if cookiecutter.include_orm == "y" %}
      - APP_DATABASE_DRIVER=postgres
      - APP_DATABASE_DSN=host=db user=postgres password=${DB_PASSWORD:-postgres} dbname=app port=5432 sslmode=disable
{% endif %}
    {% if cookiecutter.include_orm == "y" %}depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    {% else %}
    depends_on:
      redis:
        condition: service_started
    {% endif %}deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M

{% endif %}{% if cookiecutter.include_orm == "y" %}
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

{% endif %}{% if cookiecutter.include_workers == "y" %}
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

{% endif %}volumes:
{% if cookiecutter.include_orm == "y" %}
  pgdata:
{% endif %}{% if cookiecutter.include_workers == "y" %}
  redisdata:
{% endif %}