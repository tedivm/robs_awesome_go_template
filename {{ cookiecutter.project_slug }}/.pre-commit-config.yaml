repos:
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.15.0
    hooks:
      - id: golangci-lint
        args: ["--new-only"]

  - repo: local
    hooks:
      - id: go-fmt
        name: gofmt
        entry: gofmt
        args: ["-d", "-l", "-s"]
        language: golang
        types: [go]
        require_serial: true

      - id: go-vet
        name: go vet
        entry: go
        args: ["vet", "./..."]
        language: golang
        types: [go]
        pass_filenames: false

      - id: go-mod-tidy
        name: go mod tidy
        entry: go
        args: ["mod", "tidy"]
        language: golang
        types: [go]
        pass_filenames: false
