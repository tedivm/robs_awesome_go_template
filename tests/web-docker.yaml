# Web + Docker (no ORM)

default_context:
  project_name: "Web Docker Project"
  project_description: "Web with Docker but no ORM."
  author_name: "Test Author"
  author_email: "test@example.com"
  github_org: "testorg"
  go_version: "1.23"
  license: "MIT"
  include_web: "y"
  include_orm: "n"
  include_cli: "n"
  include_workers: "n"
  include_docker: "y"
  include_ai: "n"

required_files:
  - "go.mod"
  - "Dockerfile"
  - "docker-compose.yaml"
  - "cmd/web_docker_project/main.go"

excluded_files:
  - "internal/service"
  - "internal/model"
  - "internal/cli"
  - "internal/worker"
  - "migrations"
