# Bare — web only, nothing else

default_context:
  project_name: "Bare Go Project"
  project_description: "A minimal Go project."
  author_name: "Test Author"
  author_email: "test@example.com"
  github_org: "testorg"
  go_version: "1.23"
  license: "MIT"
  include_web: "y"
  include_orm: "n"
  include_cli: "n"
  include_workers: "n"
  include_docker: "n"
  include_ai: "n"

required_files:
  - "go.mod"
  - "justfile"
  - "cmd/bare_go_project/main.go"
  - "internal/config/config.go"
  - "internal/handler/health.go"
  - "internal/version/version.go"

excluded_files:
  - "Dockerfile"
  - "docker-compose.yaml"
  - "internal/service"
  - "internal/model"
  - "internal/cli"
  - "internal/worker"
  - "migrations"
