# Web + ORM + Docker

default_context:
  project_name: "Web ORM Docker Project"
  project_description: "Web with ORM and Docker."
  author_name: "Test Author"
  author_email: "test@example.com"
  github_org: "testorg"
  go_version: "1.23"
  license: "MIT"
  include_web: "y"
  include_orm: "y"
  include_cli: "n"
  include_workers: "n"
  include_docker: "y"
  include_ai: "n"

required_files:
  - "go.mod"
  - "Dockerfile"
  - "docker-compose.yaml"
  - "cmd/web_orm_docker_project/main.go"
  - "internal/handler/items.go"

excluded_files:
  - "cmd/cli"
  - "internal/cli"
  - "internal/worker"
